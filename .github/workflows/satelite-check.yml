name: Satélite Check (Android)

on:
  push:
    paths:
      - "SateliteCheck/**"
      - ".github/workflows/satelite-check.yml"
  pull_request:
    paths:
      - "SateliteCheck/**"
      - ".github/workflows/satelite-check.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SateliteCheck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes, lint e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios
          path: SateliteCheck/app/build/reports/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v5
        with:
          name: satelite-check-apk
          path: SateliteCheck/app/build/outputs/apk/debug/app-debug.apk
