name: Ventos de Palmas (Android)

on:
  push:
    paths:
      - "VentosDePalmas/**"
      - ".github/workflows/ventos-de-palmas.yml"
  pull_request:
    paths:
      - "VentosDePalmas/**"
      - ".github/workflows/ventos-de-palmas.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VentosDePalmas
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes, lint e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios
          path: VentosDePalmas/app/build/reports/
          if-no-files-found: ignore

      - name: Prévias da cena (SVG)
        uses: actions/upload-artifact@v5
        with:
          name: previas-svg
          path: VentosDePalmas/app/build/previews/

      - name: APK
        uses: actions/upload-artifact@v5
        with:
          name: ventos-de-palmas-apk
          path: VentosDePalmas/app/build/outputs/apk/debug/app-debug.apk
